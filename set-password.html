<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Set Your Password — MARCSFUNDHANG</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0D0F14;
            color: #fff;
            font-family: 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .box {
            background: #151820;
            border: 1px solid #1E2530;
            border-radius: 16px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
        }

        .logo {
            text-align: center;
            font-size: 1.6rem;
            font-weight: 700;
            color: #F0B429;
            letter-spacing: 2px;
            margin-bottom: 0.4rem;
        }

        .tagline {
            text-align: center;
            color: #8B95A1;
            font-size: 0.85rem;
            margin-bottom: 2rem;
        }

        label {
            display: block;
            color: #8B95A1;
            font-size: 0.85rem;
            margin-bottom: 0.4rem;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        .password-wrap {
            position: relative;
        }

        .password-wrap input {
            padding-right: 3.5rem;
        }

        .toggle-pw {
            position: absolute;
            right: 1rem;
            top: 0.75rem;
            cursor: pointer;
            background: none;
            border: none;
            color: #8B95A1;
            font-size: 0.85rem;
        }

        input {
            width: 100%;
            padding: 0.75rem 1rem;
            background: #0D0F14;
            border: 1px solid #1E2530;
            border-radius: 8px;
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            transition: border 0.2s;
        }

        input:focus {
            border-color: #F0B429;
        }

        .strength-bar {
            height: 4px;
            border-radius: 2px;
            margin-top: 6px;
            background: #1E2530;
            overflow: hidden;
        }

        .strength-fill {
            height: 100%;
            width: 0%;
            transition: width 0.3s, background 0.3s;
            border-radius: 2px;
        }

        .strength-label {
            font-size: 0.75rem;
            margin-top: 4px;
            color: #8B95A1;
        }

        .btn {
            width: 100%;
            padding: 0.85rem;
            background: #F0B429;
            color: #000;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 0.5rem;
        }

        .btn:hover { background: #d4a017; }
        .btn:disabled { background: #555; cursor: not-allowed; }

        .error-msg {
            background: #2a1a1a;
            border: 1px solid #FF4D4D;
            color: #FF4D4D;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .success-msg {
            background: #0a2a1a;
            border: 1px solid #00C896;
            color: #00C896;
            padding: 0.75rem 1rem;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 1rem;
            display: none;
        }

        .spinner {
            text-align: center;
            padding: 2rem 0;
            color: #8B95A1;
            font-size: 0.9rem;
        }

        .spinner::before {
            content: '';
            display: block;
            width: 36px;
            height: 36px;
            border: 3px solid #1E2530;
            border-top-color: #F0B429;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>

<body>
    <div class="box">
        <div class="logo">MARCSFUNDHANG</div>
        <div class="tagline">Welcome! Set up your account password.</div>

        <div class="error-msg" id="errorMsg"></div>
        <div class="success-msg" id="successMsg"></div>

        <!-- Loading state while we verify the token -->
        <div class="spinner" id="spinner">Verifying your link...</div>

        <!-- Password form (shown after token verified) -->
        <div id="passwordForm" style="display:none;">
            <div class="form-group">
                <label>New Password</label>
                <div class="password-wrap">
                    <input type="password" id="password" placeholder="Enter a strong password" oninput="checkStrength()" />
                    <button class="toggle-pw" onclick="togglePw('password', this)">Show</button>
                </div>
                <div class="strength-bar"><div class="strength-fill" id="strengthFill"></div></div>
                <div class="strength-label" id="strengthLabel"></div>
            </div>
            <div class="form-group">
                <label>Confirm Password</label>
                <div class="password-wrap">
                    <input type="password" id="confirmPassword" placeholder="Re-enter your password" />
                    <button class="toggle-pw" onclick="togglePw('confirmPassword', this)">Show</button>
                </div>
            </div>
            <button class="btn" id="submitBtn" onclick="setPassword()">Set Password & Login</button>
        </div>

        <!-- Link expired / invalid state -->
        <div id="invalidState" style="display:none; text-align:center; color:#8B95A1; font-size:0.9rem; padding: 1rem 0;">
            <p style="margin-bottom:1rem;">⚠️ This link has expired or is invalid.</p>
            <p>Please contact your admin to resend the invitation, or use the
                <a href="index.html" style="color:#F0B429;">Forgot Password</a> option on the login page.
            </p>
        </div>
    </div>

    <script>
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        function checkStrength() {
            const pw = document.getElementById('password').value;
            const fill = document.getElementById('strengthFill');
            const label = document.getElementById('strengthLabel');
            let score = 0;
            if (pw.length >= 8) score++;
            if (/[A-Z]/.test(pw)) score++;
            if (/[0-9]/.test(pw)) score++;
            if (/[^A-Za-z0-9]/.test(pw)) score++;

            const widths = ['0%', '25%', '50%', '75%', '100%'];
            const colors = ['transparent', '#FF4D4D', '#F0B429', '#4CAF50', '#00C896'];
            const labels = ['', 'Weak', 'Fair', 'Good', 'Strong'];

            fill.style.width = widths[score];
            fill.style.background = colors[score];
            label.textContent = labels[score];
            label.style.color = colors[score];
        }

        function showError(msg) {
            const el = document.getElementById('errorMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('successMsg').style.display = 'none';
        }

        function showSuccess(msg) {
            const el = document.getElementById('successMsg');
            el.textContent = msg;
            el.style.display = 'block';
            document.getElementById('errorMsg').style.display = 'none';
        }

        async function setPassword() {
            const password = document.getElementById('password').value;
            const confirm = document.getElementById('confirmPassword').value;

            if (!password || password.length < 8) {
                showError('Password must be at least 8 characters.'); return;
            }
            if (password !== confirm) {
                showError('Passwords do not match.'); return;
            }

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.textContent = 'Setting password...';

            const { error } = await db.auth.updateUser({ password });

            if (error) {
                showError('Failed to set password: ' + error.message);
                btn.disabled = false;
                btn.textContent = 'Set Password & Login';
                return;
            }

            showSuccess('✅ Password set successfully! Redirecting to your dashboard...');
            btn.textContent = 'Redirecting...';

            // Get profile to redirect to correct dashboard
            setTimeout(async () => {
                const { data: { session } } = await db.auth.getSession();
                if (session) {
                    const { data: profile } = await db.from('profiles')
                        .select('role')
                        .eq('id', session.user.id)
                        .single();
                    if (profile?.role === 'admin') {
                        window.location.href = 'admin-dashboard.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    window.location.href = 'index.html';
                }
            }, 1500);
        }

        // On page load: parse the token from the URL and exchange it for a session
        async function init() {
            // Supabase v2 puts tokens in the URL hash as:
            // #access_token=...&refresh_token=...&type=signup  (or type=recovery)
            const hash = window.location.hash;

            if (hash && hash.includes('access_token')) {
                // Parse the hash params
                const params = new URLSearchParams(hash.substring(1));
                const accessToken = params.get('access_token');
                const refreshToken = params.get('refresh_token');
                const type = params.get('type'); // 'signup' or 'recovery'

                if (accessToken && refreshToken) {
                    // Exchange tokens to create an active session
                    const { error } = await db.auth.setSession({
                        access_token: accessToken,
                        refresh_token: refreshToken
                    });

                    if (error) {
                        document.getElementById('spinner').style.display = 'none';
                        document.getElementById('invalidState').style.display = 'block';
                        return;
                    }

                    // Clear hash from URL so it's not accidentally reused
                    history.replaceState(null, '', window.location.pathname);

                    document.getElementById('spinner').style.display = 'none';
                    document.getElementById('passwordForm').style.display = 'block';
                    return;
                }
            }

            // No valid token in URL — check if user already has a session
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                // Already logged in, redirect
                const { data: profile } = await db.from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                window.location.href = profile?.role === 'admin' ? 'admin-dashboard.html' : 'dashboard.html';
                return;
            }

            // No token, no session
            document.getElementById('spinner').style.display = 'none';
            document.getElementById('invalidState').style.display = 'block';
        }

        init();
    </script>

</body>

</html>
