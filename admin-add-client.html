<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Add Investor — MARCSFUNDHANG</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0D0F14;
            --card: #151820;
            --card2: #1a1f2e;
            --border: #1E2530;
            --gold: #F0B429;
            --gold-dim: #d4a017;
            --green: #00C896;
            --red: #FF4D4D;
            --white: #FFFFFF;
            --grey: #8B95A1;
            --grey-dim: #4a5568;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(21, 24, 32, 0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-back {
            width: 34px;
            height: 34px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--grey);
            text-decoration: none;
        }

        .nav-back:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .nav-back svg {
            width: 16px;
            height: 16px;
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .nav-logo {
            font-size: 1rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        /* CONTAINER */
        .container {
            padding: 1.25rem;
            max-width: 480px;
            margin: 0 auto;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ID PREVIEW */
        .id-preview {
            background: linear-gradient(135deg, var(--card2), var(--card));
            border: 1px solid rgba(240, 180, 41, 0.2);
            border-radius: 16px;
            padding: 1.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.05s both;
        }

        .id-icon {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dim));
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .id-icon svg {
            width: 22px;
            height: 22px;
            color: #000;
        }

        .id-label {
            font-size: 0.72rem;
            color: var(--grey);
            margin-bottom: 0.3rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .id-value {
            font-size: 1.3rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1px;
        }

        /* INFO NOTE */
        .info-note {
            background: rgba(37, 99, 168, 0.08);
            border: 1px solid rgba(37, 99, 168, 0.2);
            border-radius: 12px;
            padding: 0.9rem 1rem;
            display: flex;
            align-items: flex-start;
            gap: 0.75rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.1s both;
        }

        .info-note svg {
            width: 16px;
            height: 16px;
            color: #7B8FFF;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .info-note p {
            font-size: 0.78rem;
            color: var(--grey);
            line-height: 1.5;
        }

        /* FORM CARD */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.15s both;
        }

        .form-section-title {
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--grey);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .form-section-title svg {
            width: 14px;
            height: 14px;
        }

        .field {
            margin-bottom: 0.9rem;
        }

        .field:last-child {
            margin-bottom: 0;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            color: var(--grey);
            font-weight: 500;
            margin-bottom: 0.4rem;
        }

        .field input,
        .field textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .field input:focus,
        .field textarea:focus {
            border-color: var(--gold);
        }

        .field input::placeholder,
        .field textarea::placeholder {
            color: var(--grey-dim);
        }

        .field textarea {
            resize: none;
            min-height: 70px;
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .required-star {
            color: var(--red);
            margin-left: 0.2rem;
        }

        /* SUBMIT */
        .btn-submit {
            width: 100%;
            padding: 0.95rem;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 14px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.6rem;
            box-shadow: 0 4px 20px rgba(240, 180, 41, 0.25);
            animation: fadeUp 0.4s ease 0.2s both;
        }

        .btn-submit svg {
            width: 18px;
            height: 18px;
        }

        .btn-submit:hover {
            background: var(--gold-dim);
            transform: translateY(-1px);
            box-shadow: 0 6px 24px rgba(240, 180, 41, 0.35);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            background: var(--border);
            color: var(--grey);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        .btn-submit .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        .btn-submit.loading .btn-text {
            display: none;
        }

        .btn-submit.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* MESSAGES */
        .msg {
            border-radius: 12px;
            padding: 0.85rem 1rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
            align-items: flex-start;
            gap: 0.6rem;
            line-height: 1.5;
            animation: fadeUp 0.4s ease 0.2s both;
        }

        .msg.show {
            display: flex;
        }

        .msg svg {
            width: 16px;
            height: 16px;
            flex-shrink: 0;
            margin-top: 0.1rem;
        }

        .msg-success {
            background: rgba(0, 200, 150, 0.08);
            border: 1px solid rgba(0, 200, 150, 0.25);
            color: var(--green);
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.25);
            color: var(--red);
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(21, 24, 32, 0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 0.6rem 0;
            padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
            display: flex;
            z-index: 100;
        }

        .bn-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            cursor: pointer;
            padding: 0.4rem 0;
            text-decoration: none;
            transition: all 0.2s;
        }

        .bn-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.2s;
        }

        .bn-label {
            font-size: 0.62rem;
            color: var(--grey);
            font-weight: 500;
        }

        .bn-item.active .bn-label {
            color: var(--gold);
        }

        .bn-item:active .bn-icon {
            transform: scale(0.9);
        }

        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
            }

            .bottom-nav {
                display: none;
            }

            .container {
                max-width: 600px;
                padding: 2rem;
            }

            .field-row {
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <a href="admin.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 5l-7 7 7 7" />
                </svg>
            </a>
            <div class="nav-title">Add New Investor</div>
        </div>
        <div class="nav-logo">MARCSFUNDHANG</div>
    </div>

    <div class="container">

        <!-- ID PREVIEW -->
        <div class="id-preview">
            <div class="id-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
            </div>
            <div>
                <div class="id-label">Auto-generated Investor ID</div>
                <div class="id-value" id="investorIdPreview">Loading...</div>
            </div>
        </div>

        <!-- INFO NOTE -->
        <div class="info-note">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="12" y1="8" x2="12" y2="12" />
                <line x1="12" y1="16" x2="12.01" y2="16" />
            </svg>
            <p>The investor will receive a welcome email with a link to set their password after you create their
                account.</p>
        </div>

        <!-- MESSAGES -->
        <div class="msg msg-success" id="successMsg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="20 6 9 17 4 12" />
            </svg>
            <span id="successText"></span>
        </div>
        <div class="msg msg-error" id="errorMsg">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10" />
                <line x1="15" y1="9" x2="9" y2="15" />
                <line x1="9" y1="9" x2="15" y2="15" />
            </svg>
            <span id="errorText"></span>
        </div>

        <!-- PERSONAL INFO -->
        <div class="form-card">
            <div class="form-section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 21v-2a4 4 0 00-4-4H8a4 4 0 00-4 4v2" />
                    <circle cx="12" cy="7" r="4" />
                </svg>
                Personal Information
            </div>
            <div class="field">
                <label>Full Name <span class="required-star">*</span></label>
                <input type="text" id="fullName" placeholder="e.g. Rahul Sharma" />
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Email Address <span class="required-star">*</span></label>
                    <input type="email" id="email" placeholder="investor@email.com" />
                </div>
                <div class="field">
                    <label>Mobile Number <span class="required-star">*</span></label>
                    <input type="tel" id="phone" placeholder="9876543210" />
                </div>
            </div>
        </div>

        <!-- INVESTMENT INFO -->
        <div class="form-card">
            <div class="form-section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="12" y1="1" x2="12" y2="23" />
                    <path d="M17 5H9.5a3.5 3.5 0 000 7h5a3.5 3.5 0 010 7H6" />
                </svg>
                Investment Details
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Invested Amount (₹) <span class="required-star">*</span></label>
                    <input type="number" id="investedAmount" placeholder="e.g. 100000" />
                </div>
                <div class="field">
                    <label>Current Value (₹)</label>
                    <input type="number" id="currentValue" placeholder="Same as invested" />
                </div>
            </div>
            <div class="field">
                <label>Investment Date <span class="required-star">*</span></label>
                <input type="date" id="investmentDate" />
            </div>
        </div>

        <!-- NOTES -->
        <div class="form-card">
            <div class="form-section-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                </svg>
                Internal Notes
            </div>
            <div class="field">
                <label>Notes (visible to admin only)</label>
                <textarea id="notes" placeholder="Any internal notes about this investor..."></textarea>
            </div>
        </div>

        <!-- SUBMIT -->
        <button class="btn-submit" id="submitBtn" onclick="addInvestor()">
            <span class="btn-text" style="display:flex;align-items:center;gap:0.6rem;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <path d="M16 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                    <circle cx="8.5" cy="7" r="4" />
                    <line x1="20" y1="8" x2="20" y2="14" />
                    <line x1="23" y1="11" x2="17" y2="11" />
                </svg>
                Create Investor Account
            </span>
            <div class="spinner"></div>
        </button>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a class="bn-item" href="admin-dashboard.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <span class="bn-label">Overview</span>
        </a>
        <a class="bn-item" href="admin.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
            </svg>
            <span class="bn-label">Investors</span>
        </a>
        <a class="bn-item active" href="admin-add-client.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="bn-label" style="color:var(--gold)">Add</span>
        </a>
        <a class="bn-item" href="admin-announcements.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />
            </svg>
            <span class="bn-label">Announce</span>
        </a>
        <a class="bn-item" href="admin-reports.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14 2 14 8 20 8" />
            </svg>
            <span class="bn-label">Reports</span>
        </a>
    </div>

    <script>
        async function checkAuth() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: profile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { window.location.href = 'index.html'; return; }
            generateInvestorId();
            document.getElementById('investmentDate').value = new Date().toISOString().split('T')[0];
        }

        async function generateInvestorId() {
            const { data } = await db.from('profiles').select('investor_id').eq('role', 'client');
            const count = (data ? data.length : 0) + 1;
            document.getElementById('investorIdPreview').textContent = 'MFH-' + String(count).padStart(3, '0');
            return 'MFH-' + String(count).padStart(3, '0');
        }

        function showSuccess(msg) {
            document.getElementById('successText').textContent = msg;
            document.getElementById('successMsg').classList.add('show');
            document.getElementById('errorMsg').classList.remove('show');
        }

        function showError(msg) {
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.add('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        async function addInvestor() {
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const investedAmount = parseFloat(document.getElementById('investedAmount').value);
            const investmentDate = document.getElementById('investmentDate').value;
            const currentValue = parseFloat(document.getElementById('currentValue').value) || investedAmount;
            const notes = document.getElementById('notes').value.trim();

            if (!fullName || !email || !phone || !investedAmount || !investmentDate) {
                showError('Please fill in all required fields.'); return;
            }

            const btn = document.getElementById('submitBtn');
            btn.classList.add('loading'); btn.disabled = true;

            try {
                const investorId = await generateInvestorId();

                const { data: authData, error: authError } = await db.auth.signUp({
                    email, password: Math.random().toString(36).slice(-12) + 'Aa1!'
                });
                if (authError) { showError('Error creating account: ' + authError.message); btn.classList.remove('loading'); btn.disabled = false; return; }

                const userId = authData.user.id;

                const { error: profileError } = await db.from('profiles').insert({
                    id: userId, investor_id: investorId, full_name: fullName,
                    email, phone, role: 'client', is_active: true, notes
                });
                if (profileError) { showError('Error saving profile: ' + profileError.message); btn.classList.remove('loading'); btn.disabled = false; return; }

                await db.from('portfolios').insert({
                    client_id: userId, invested_amount: investedAmount,
                    current_value: currentValue, investment_date: investmentDate, monthly_return: 0
                });

                await db.from('transactions').insert({
                    client_id: userId, date: investmentDate, type: 'Deposit',
                    amount: investedAmount, current_value_snapshot: currentValue,
                    remark: 'Initial investment'
                });

                showSuccess(`Investor ${investorId} created! Welcome email sent to ${email}`);
                btn.classList.remove('loading'); btn.disabled = false;

                setTimeout(() => {
                    document.getElementById('fullName').value = '';
                    document.getElementById('email').value = '';
                    document.getElementById('phone').value = '';
                    document.getElementById('investedAmount').value = '';
                    document.getElementById('currentValue').value = '';
                    document.getElementById('notes').value = '';
                    generateInvestorId();
                }, 2000);

            } catch (err) {
                showError('Something went wrong: ' + err.message);
                btn.classList.remove('loading'); btn.disabled = false;
            }
        }

        checkAuth();
    </script>

</body>

</html>
