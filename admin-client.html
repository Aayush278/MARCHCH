<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Investor Detail — MARCSFUNDHANG</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0D0F14;
            --card: #151820;
            --card2: #1a1f2e;
            --border: #1E2530;
            --gold: #F0B429;
            --gold-dim: #d4a017;
            --green: #00C896;
            --red: #FF4D4D;
            --white: #FFFFFF;
            --grey: #8B95A1;
            --grey-dim: #4a5568;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            padding-bottom: 5rem;
        }

        /* NAVBAR */
        .navbar {
            background: rgba(21, 24, 32, 0.97);
            backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--border);
            padding: 0 1.25rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .nav-left {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .nav-back {
            width: 34px;
            height: 34px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--grey);
            text-decoration: none;
        }

        .nav-back:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .nav-back svg {
            width: 16px;
            height: 16px;
        }

        .nav-title {
            font-size: 0.95rem;
            font-weight: 600;
        }

        .nav-right {
            display: flex;
            gap: 0.5rem;
        }

        .btn-icon {
            width: 34px;
            height: 34px;
            background: var(--card2);
            border: 1px solid var(--border);
            border-radius: 10px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            color: var(--grey);
        }

        .btn-icon:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .btn-icon.danger:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-icon svg {
            width: 15px;
            height: 15px;
        }

        /* CONTAINER */
        .container {
            padding: 1.25rem;
            max-width: 480px;
            margin: 0 auto;
        }

        @keyframes fadeUp {
            from {
                opacity: 0;
                transform: translateY(16px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* INVESTOR HEADER */
        .investor-header {
            background: linear-gradient(135deg, var(--card2), var(--card));
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 1rem;
            animation: fadeUp 0.4s ease 0.05s both;
        }

        .inv-avatar {
            width: 52px;
            height: 52px;
            border-radius: 14px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dim));
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            color: #000;
            font-size: 1.3rem;
            flex-shrink: 0;
        }

        .inv-avatar.suspended {
            background: linear-gradient(135deg, var(--grey-dim), #2a2a2a);
            color: var(--grey);
        }

        .inv-details {
            flex: 1;
            min-width: 0;
        }

        .inv-name {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 0.2rem;
        }

        .inv-id {
            font-size: 0.75rem;
            color: var(--gold);
            font-weight: 600;
            margin-bottom: 0.3rem;
        }

        .inv-meta {
            font-size: 0.72rem;
            color: var(--grey);
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.25rem 0.65rem;
            border-radius: 99px;
            font-size: 0.7rem;
            font-weight: 600;
        }

        .status-badge.active {
            background: rgba(0, 200, 150, 0.1);
            color: var(--green);
            border: 1px solid rgba(0, 200, 150, 0.2);
        }

        .status-badge.suspended {
            background: rgba(255, 77, 77, 0.1);
            color: var(--red);
            border: 1px solid rgba(255, 77, 77, 0.2);
        }

        .status-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: currentColor;
        }

        /* STATS GRID */
        .stats-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.1s both;
        }

        .stat-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1rem;
        }

        .stat-label {
            font-size: 0.68rem;
            color: var(--grey);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 0.35rem;
        }

        .stat-value {
            font-size: 1.1rem;
            font-weight: 700;
        }

        .stat-value.gold {
            color: var(--gold);
        }

        .stat-value.green {
            color: var(--green);
        }

        .stat-value.red {
            color: var(--red);
        }

        .stat-value.white {
            color: var(--white);
        }

        .stat-sub {
            font-size: 0.68rem;
            color: var(--grey-dim);
            margin-top: 0.2rem;
        }

        /* ACTION BUTTONS ROW */
        .action-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.6rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.15s both;
        }

        .action-btn {
            padding: 0.75rem 1rem;
            border-radius: 12px;
            border: 1.5px solid var(--border);
            background: var(--card);
            color: var(--white);
            font-size: 0.82rem;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.2s;
        }

        .action-btn svg {
            width: 15px;
            height: 15px;
            flex-shrink: 0;
        }

        .action-btn.gold {
            background: var(--gold);
            color: #000;
            border-color: var(--gold);
        }

        .action-btn.gold:hover {
            background: var(--gold-dim);
        }

        .action-btn.outline:hover {
            border-color: var(--gold);
            color: var(--gold);
        }

        .action-btn.danger {
            border-color: rgba(255, 77, 77, 0.3);
            color: var(--red);
        }

        .action-btn.danger:hover {
            background: rgba(255, 77, 77, 0.08);
            border-color: var(--red);
        }

        .action-btn.success {
            border-color: rgba(0, 200, 150, 0.3);
            color: var(--green);
        }

        .action-btn.success:hover {
            background: rgba(0, 200, 150, 0.08);
            border-color: var(--green);
        }

        /* FORMS */
        .form-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 18px;
            padding: 1.25rem;
            margin-bottom: 1rem;
            animation: fadeUp 0.4s ease 0.2s both;
        }

        .form-card.hidden {
            display: none;
        }

        .form-title {
            font-size: 0.88rem;
            font-weight: 600;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            color: var(--white);
        }

        .form-title svg {
            width: 16px;
            height: 16px;
            color: var(--gold);
        }

        .field {
            margin-bottom: 0.9rem;
        }

        .field label {
            display: block;
            font-size: 0.72rem;
            color: var(--grey);
            font-weight: 500;
            margin-bottom: 0.4rem;
            letter-spacing: 0.3px;
        }

        .field input,
        .field select,
        .field textarea {
            width: 100%;
            padding: 0.75rem 0.9rem;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 10px;
            color: var(--white);
            font-size: 0.85rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.2s;
            -webkit-appearance: none;
        }

        .field input:focus,
        .field select:focus,
        .field textarea:focus {
            border-color: var(--gold);
        }

        .field textarea {
            resize: none;
            min-height: 70px;
        }

        .field select option {
            background: var(--card);
        }

        .field-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.75rem;
        }

        .btn-submit {
            width: 100%;
            padding: 0.85rem;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-submit svg {
            width: 16px;
            height: 16px;
        }

        .btn-submit:hover {
            background: var(--gold-dim);
        }

        .btn-submit:disabled {
            background: var(--border);
            color: var(--grey);
            cursor: not-allowed;
        }

        /* MESSAGES */
        .msg {
            border-radius: 10px;
            padding: 0.65rem 0.9rem;
            font-size: 0.8rem;
            margin-bottom: 0.75rem;
            display: none;
        }

        .msg.show {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .msg-success {
            background: rgba(0, 200, 150, 0.08);
            border: 1px solid rgba(0, 200, 150, 0.25);
            color: var(--green);
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.25);
            color: var(--red);
        }

        /* TRANSACTION LIST */
        .tx-section {
            animation: fadeUp 0.4s ease 0.25s both;
            margin-bottom: 1rem;
        }

        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.75rem;
        }

        .section-title {
            font-size: 0.88rem;
            font-weight: 600;
        }

        .tx-count {
            font-size: 0.72rem;
            color: var(--grey);
        }

        .tx-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .tx-item {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 0.9rem 1rem;
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .tx-icon {
            width: 36px;
            height: 36px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }

        .tx-icon svg {
            width: 16px;
            height: 16px;
        }

        .tx-icon.deposit {
            background: rgba(0, 200, 150, 0.12);
            color: var(--green);
        }

        .tx-icon.withdrawal {
            background: rgba(255, 77, 77, 0.12);
            color: var(--red);
        }

        .tx-icon.return {
            background: rgba(123, 143, 255, 0.12);
            color: #7B8FFF;
        }

        .tx-icon.bonus {
            background: rgba(240, 180, 41, 0.12);
            color: var(--gold);
        }

        .tx-info {
            flex: 1;
            min-width: 0;
        }

        .tx-type {
            font-size: 0.83rem;
            font-weight: 600;
        }

        .tx-date {
            font-size: 0.7rem;
            color: var(--grey);
            margin-top: 0.15rem;
        }

        .tx-remark {
            font-size: 0.7rem;
            color: var(--grey-dim);
            margin-top: 0.1rem;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .tx-right {
            text-align: right;
            flex-shrink: 0;
        }

        .tx-amount {
            font-size: 0.88rem;
            font-weight: 700;
        }

        .tx-amount.positive {
            color: var(--green);
        }

        .tx-amount.negative {
            color: var(--red);
        }

        .tx-amount.neutral {
            color: var(--white);
        }

        .tx-snapshot {
            font-size: 0.7rem;
            color: var(--grey);
            margin-top: 0.15rem;
        }

        /* EMPTY */
        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--grey);
        }

        .empty-state svg {
            width: 36px;
            height: 36px;
            margin-bottom: 0.5rem;
            opacity: 0.4;
        }

        .empty-state p {
            font-size: 0.82rem;
        }

        /* BOTTOM NAV */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(21, 24, 32, 0.97);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--border);
            padding: 0.6rem 0;
            padding-bottom: calc(0.6rem + env(safe-area-inset-bottom));
            display: flex;
            z-index: 100;
        }

        .bn-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.2rem;
            cursor: pointer;
            padding: 0.4rem 0;
            text-decoration: none;
            transition: all 0.2s;
        }

        .bn-icon {
            width: 22px;
            height: 22px;
            transition: transform 0.2s;
        }

        .bn-label {
            font-size: 0.62rem;
            color: var(--grey);
            font-weight: 500;
        }

        .bn-item.active .bn-label {
            color: var(--gold);
        }

        .bn-item:active .bn-icon {
            transform: scale(0.9);
        }

        @media (min-width: 768px) {
            body {
                padding-bottom: 0;
            }

            .bottom-nav {
                display: none;
            }

            .container {
                max-width: 900px;
                padding: 2rem;
            }

            .stats-grid {
                grid-template-columns: repeat(3, 1fr);
            }

            .action-row {
                grid-template-columns: repeat(4, 1fr);
            }

            .form-grid {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 1rem;
            }

            .form-grid .form-card {
                margin-bottom: 0;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <div class="navbar">
        <div class="nav-left">
            <a href="admin.html" class="nav-back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 5l-7 7 7 7" />
                </svg>
            </a>
            <div class="nav-title" id="navTitle">Investor Detail</div>
        </div>
        <div class="nav-right">
            <button class="btn-icon danger" onclick="deleteInvestor()" title="Delete investor">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="3 6 5 6 21 6" />
                    <path d="M19 6l-1 14a2 2 0 01-2 2H8a2 2 0 01-2-2L5 6M10 11v6M14 11v6M9 6V4h6v2" />
                </svg>
            </button>
        </div>
    </div>

    <div class="container">

        <!-- INVESTOR HEADER -->
        <div class="investor-header" id="investorHeader">
            <div class="inv-avatar" id="invAvatar">?</div>
            <div class="inv-details">
                <div class="inv-name" id="invName">Loading...</div>
                <div class="inv-id" id="invId">-</div>
                <div class="inv-meta" id="invMeta">-</div>
                <div style="margin-top:0.4rem;" id="invStatusBadge"></div>
            </div>
        </div>

        <!-- STATS GRID -->
        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-label">Invested</div>
                <div class="stat-value gold" id="statInvested">₹0</div>
                <div class="stat-sub" id="statDate">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Current Value</div>
                <div class="stat-value white" id="statCurrent">₹0</div>
                <div class="stat-sub" id="statUpdated">-</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Profit / Loss</div>
                <div class="stat-value" id="statProfit">₹0</div>
                <div class="stat-sub" id="statGrowth">0%</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Monthly Return</div>
                <div class="stat-value green" id="statMonthly">₹0</div>
                <div class="stat-sub">This month</div>
            </div>
        </div>

        <!-- ACTION BUTTONS -->
        <div class="action-row">
            <button class="action-btn gold" onclick="toggleForm('updateForm')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z" />
                </svg>
                Update Value
            </button>
            <button class="action-btn outline" onclick="toggleForm('txForm')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Add Transaction
            </button>
            <button class="action-btn outline" onclick="toggleForm('editForm')">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M20 21a8 8 0 10-16 0" />
                </svg>
                Edit Info
            </button>
            <button class="action-btn" id="suspendBtn" onclick="toggleSuspend()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10" />
                    <line x1="4.93" y1="4.93" x2="19.07" y2="19.07" />
                </svg>
                Suspend
            </button>
        </div>

        <!-- UPDATE PORTFOLIO VALUE FORM -->
        <div class="form-card hidden" id="updateForm">
            <div class="form-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="23 6 13.5 15.5 8.5 10.5 1 18" />
                    <polyline points="17 6 23 6 23 12" />
                </svg>
                Update Portfolio Value
            </div>
            <div class="msg msg-success" id="updateSuccess"></div>
            <div class="msg msg-error" id="updateError"></div>
            <div class="field-row">
                <div class="field">
                    <label>New Current Value (₹)</label>
                    <input type="number" id="newValue" placeholder="e.g. 125000" />
                </div>
                <div class="field">
                    <label>Monthly Return (₹)</label>
                    <input type="number" id="newMonthly" placeholder="e.g. 5000" />
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Date</label>
                    <input type="date" id="updateDate" />
                </div>
                <div class="field">
                    <label>Remark</label>
                    <input type="text" id="updateRemark" placeholder="e.g. April returns" />
                </div>
            </div>
            <button class="btn-submit" onclick="updatePortfolio()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                Update Portfolio
            </button>
        </div>

        <!-- ADD TRANSACTION FORM -->
        <div class="form-card hidden" id="txForm">
            <div class="form-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14" />
                </svg>
                Add Transaction
            </div>
            <div class="msg msg-success" id="txSuccess"></div>
            <div class="msg msg-error" id="txError"></div>
            <div class="field-row">
                <div class="field">
                    <label>Type</label>
                    <select id="txType">
                        <option value="Deposit">Deposit</option>
                        <option value="Withdrawal">Withdrawal</option>
                        <option value="Return Update">Return Update</option>
                        <option value="Bonus">Bonus</option>
                    </select>
                </div>
                <div class="field">
                    <label>Amount (₹)</label>
                    <input type="number" id="txAmount" placeholder="e.g. 10000" />
                </div>
            </div>
            <div class="field-row">
                <div class="field">
                    <label>Date</label>
                    <input type="date" id="txDate" />
                </div>
                <div class="field">
                    <label>Remark</label>
                    <input type="text" id="txRemark" placeholder="Optional note" />
                </div>
            </div>
            <button class="btn-submit" onclick="addTransaction()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                Add Transaction
            </button>
        </div>

        <!-- EDIT INFO FORM -->
        <div class="form-card hidden" id="editForm">
            <div class="form-title">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="8" r="4" />
                    <path d="M20 21a8 8 0 10-16 0" />
                </svg>
                Edit Investor Info
            </div>
            <div class="msg msg-success" id="editSuccess"></div>
            <div class="field-row">
                <div class="field">
                    <label>Full Name</label>
                    <input type="text" id="editName" />
                </div>
                <div class="field">
                    <label>Mobile Number</label>
                    <input type="tel" id="editPhone" />
                </div>
            </div>
            <div class="field">
                <label>Internal Notes</label>
                <textarea id="editNotes" placeholder="Notes visible only to admin..."></textarea>
            </div>
            <button class="btn-submit" onclick="saveEdit()">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="20 6 9 17 4 12" />
                </svg>
                Save Changes
            </button>
        </div>

        <!-- TRANSACTION HISTORY -->
        <div class="tx-section">
            <div class="section-header">
                <div class="section-title">Transaction History</div>
                <div class="tx-count" id="txCount"></div>
            </div>
            <div class="tx-list" id="txList">
                <div class="empty-state">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                        <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                        <polyline points="14 2 14 8 20 8" />
                    </svg>
                    <p>Loading transactions...</p>
                </div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAV -->
    <div class="bottom-nav">
        <a class="bn-item" href="admin-dashboard.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <rect x="3" y="3" width="7" height="7" />
                <rect x="14" y="3" width="7" height="7" />
                <rect x="3" y="14" width="7" height="7" />
                <rect x="14" y="14" width="7" height="7" />
            </svg>
            <span class="bn-label">Overview</span>
        </a>
        <a class="bn-item active" href="admin.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--gold)" stroke-width="2">
                <path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2" />
                <circle cx="9" cy="7" r="4" />
                <path d="M23 21v-2a4 4 0 00-3-3.87M16 3.13a4 4 0 010 7.75" />
            </svg>
            <span class="bn-label" style="color:var(--gold)">Investors</span>
        </a>
        <a class="bn-item" href="admin-add-client.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M12 5v14M5 12h14" />
            </svg>
            <span class="bn-label">Add</span>
        </a>
        <a class="bn-item" href="admin-announcements.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M18 8A6 6 0 006 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 01-3.46 0" />
            </svg>
            <span class="bn-label">Announce</span>
        </a>
        <a class="bn-item" href="admin-reports.html">
            <svg class="bn-icon" viewBox="0 0 24 24" fill="none" stroke="var(--grey)" stroke-width="2">
                <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z" />
                <polyline points="14 2 14 8 20 8" />
            </svg>
            <span class="bn-label">Reports</span>
        </a>
    </div>

    <script>
        const params = new URLSearchParams(window.location.search);
        const clientId = params.get('id');
        let investorData = null;
        let portfolioData = null;

        const txConfig = {
            'Deposit': { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>`, cls: 'deposit', amtCls: 'positive', prefix: '+' },
            'Withdrawal': { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14"/></svg>`, cls: 'withdrawal', amtCls: 'negative', prefix: '-' },
            'Return Update': { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/></svg>`, cls: 'return', amtCls: 'positive', prefix: '+' },
            'Bonus': { icon: `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`, cls: 'bonus', amtCls: 'positive', prefix: '+' },
        };

        async function init() {
            const { data: { session } } = await db.auth.getSession();
            if (!session) { window.location.href = 'index.html'; return; }
            const { data: profile } = await db.from('profiles').select('role').eq('id', session.user.id).single();
            if (!profile || profile.role !== 'admin') { window.location.href = 'index.html'; return; }
            if (!clientId) { window.location.href = 'admin.html'; return; }
            await loadInvestor();
            loadTransactions();
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('updateDate').value = today;
            document.getElementById('txDate').value = today;
        }

        async function loadInvestor() {
            const { data: inv } = await db.from('profiles').select('*').eq('id', clientId).single();
            const { data: port } = await db.from('portfolios').select('*').eq('client_id', clientId).single();
            investorData = inv;
            portfolioData = port;
            renderInvestor();
        }

        function renderInvestor() {
            const inv = investorData;
            const port = portfolioData || {};
            const initial = (inv.full_name || '?')[0].toUpperCase();

            document.getElementById('navTitle').textContent = inv.full_name || 'Investor';
            document.getElementById('invAvatar').textContent = initial;
            document.getElementById('invAvatar').className = 'inv-avatar' + (inv.is_active ? '' : ' suspended');
            document.getElementById('invName').textContent = inv.full_name || '-';
            document.getElementById('invId').textContent = inv.investor_id || '-';
            document.getElementById('invMeta').textContent = (inv.email || '') + ' · ' + (inv.phone || '');
            document.getElementById('invStatusBadge').innerHTML = inv.is_active
                ? `<span class="status-badge active"><span class="status-dot"></span>Active</span>`
                : `<span class="status-badge suspended"><span class="status-dot"></span>Suspended</span>`;

            const profit = (port.current_value || 0) - (port.invested_amount || 0);
            const growth = port.invested_amount ? ((profit / port.invested_amount) * 100).toFixed(2) : '0.00';
            const isProfit = profit >= 0;

            document.getElementById('statInvested').textContent = '₹' + (port.invested_amount || 0).toLocaleString('en-IN');
            document.getElementById('statDate').textContent = port.investment_date ? new Date(port.investment_date).toLocaleDateString('en-IN') : '-';
            document.getElementById('statCurrent').textContent = '₹' + (port.current_value || 0).toLocaleString('en-IN');
            document.getElementById('statUpdated').textContent = port.last_updated ? new Date(port.last_updated).toLocaleDateString('en-IN') : '-';
            document.getElementById('statProfit').textContent = (isProfit ? '+₹' : '-₹') + Math.abs(profit).toLocaleString('en-IN');
            document.getElementById('statProfit').className = 'stat-value ' + (isProfit ? 'green' : 'red');
            document.getElementById('statGrowth').textContent = (isProfit ? '+' : '') + growth + '%';
            document.getElementById('statMonthly').textContent = '₹' + (port.monthly_return || 0).toLocaleString('en-IN');

            const suspendBtn = document.getElementById('suspendBtn');
            if (inv.is_active) {
                suspendBtn.className = 'action-btn danger';
                suspendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg> Suspend`;
            } else {
                suspendBtn.className = 'action-btn success';
                suspendBtn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Activate`;
            }

            document.getElementById('editName').value = inv.full_name || '';
            document.getElementById('editPhone').value = inv.phone || '';
            document.getElementById('editNotes').value = inv.notes || '';
        }

        async function loadTransactions() {
            const { data } = await db.from('transactions').select('*').eq('client_id', clientId).order('date', { ascending: false });
            const list = document.getElementById('txList');
            document.getElementById('txCount').textContent = (data?.length || 0) + ' entries';

            if (!data || !data.length) {
                list.innerHTML = `<div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><p>No transactions yet.</p></div>`;
                return;
            }

            list.innerHTML = data.map(t => {
                const cfg = txConfig[t.type] || txConfig['Return Update'];
                return `
          <div class="tx-item">
            <div class="tx-icon ${cfg.cls}">${cfg.icon}</div>
            <div class="tx-info">
              <div class="tx-type">${t.type}</div>
              <div class="tx-date">${new Date(t.date).toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' })}</div>
              ${t.remark ? `<div class="tx-remark">${t.remark}</div>` : ''}
            </div>
            <div class="tx-right">
              <div class="tx-amount ${cfg.amtCls}">${cfg.prefix}₹${Math.abs(t.amount || 0).toLocaleString('en-IN')}</div>
              <div class="tx-snapshot">₹${(t.current_value_snapshot || 0).toLocaleString('en-IN')}</div>
            </div>
          </div>`;
            }).join('');
        }

        function toggleForm(id) {
            const form = document.getElementById(id);
            const isHidden = form.classList.contains('hidden');
            ['updateForm', 'txForm', 'editForm'].forEach(f => document.getElementById(f).classList.add('hidden'));
            if (isHidden) {
                form.classList.remove('hidden');
                form.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
        }

        async function updatePortfolio() {
            const newValue = parseFloat(document.getElementById('newValue').value);
            const monthly = parseFloat(document.getElementById('newMonthly').value) || 0;
            const date = document.getElementById('updateDate').value;
            const remark = document.getElementById('updateRemark').value.trim();
            if (!newValue || !date) { showMsg('updateError', 'Please fill in value and date.'); return; }

            const { error } = await db.from('portfolios').update({
                current_value: newValue, monthly_return: monthly, last_updated: new Date().toISOString()
            }).eq('client_id', clientId);
            if (error) { showMsg('updateError', error.message); return; }

            await db.from('transactions').insert({
                client_id: clientId, date, type: 'Return Update',
                amount: newValue - (portfolioData?.current_value || 0),
                current_value_snapshot: newValue, remark: remark || 'Portfolio value updated'
            });
            await db.from('audit_log').insert({
                client_id: clientId, action: 'UPDATE_VALUE',
                old_value: String(portfolioData?.current_value), new_value: String(newValue)
            });
            showMsg('updateSuccess', 'Portfolio value updated successfully!');
            await loadInvestor();
            loadTransactions();
        }

        async function addTransaction() {
            const type = document.getElementById('txType').value;
            const amount = parseFloat(document.getElementById('txAmount').value);
            const date = document.getElementById('txDate').value;
            const remark = document.getElementById('txRemark').value.trim();
            if (!amount || !date) { showMsg('txError', 'Please fill in amount and date.'); return; }

            let newInvested = portfolioData?.invested_amount || 0;
            let newCurrentValue = portfolioData?.current_value || 0;

            if (type === 'Deposit') { newInvested += amount; newCurrentValue += amount; }
            else if (type === 'Withdrawal') { newInvested -= amount; newCurrentValue -= amount; }
            else if (type === 'Bonus') { newCurrentValue += amount; }

            if (['Deposit', 'Withdrawal', 'Bonus'].includes(type)) {
                const { error } = await db.from('portfolios').update({
                    invested_amount: newInvested, current_value: newCurrentValue,
                    last_updated: new Date().toISOString()
                }).eq('client_id', clientId);
                if (error) { showMsg('txError', error.message); return; }
            }

            await db.from('transactions').insert({
                client_id: clientId, date, type, amount,
                current_value_snapshot: newCurrentValue, remark
            });
            await db.from('audit_log').insert({
                client_id: clientId, action: 'ADD_TRANSACTION',
                new_value: JSON.stringify({ type, amount, date })
            });

            showMsg('txSuccess', 'Transaction added successfully!');
            await loadInvestor();
            loadTransactions();
        }

        async function saveEdit() {
            const name = document.getElementById('editName').value.trim();
            const phone = document.getElementById('editPhone').value.trim();
            const notes = document.getElementById('editNotes').value.trim();
            const { error } = await db.from('profiles').update({ full_name: name, phone, notes }).eq('id', clientId);
            if (error) { return; }
            showMsg('editSuccess', 'Investor info updated!');
            loadInvestor();
        }

        async function toggleSuspend() {
            const action = investorData.is_active ? 'suspend' : 'activate';
            if (!confirm(`Are you sure you want to ${action} this investor?`)) return;
            await db.from('profiles').update({ is_active: !investorData.is_active }).eq('id', clientId);
            await db.from('audit_log').insert({ client_id: clientId, action: 'SUSPEND', new_value: String(!investorData.is_active) });
            loadInvestor();
        }

        async function deleteInvestor() {
            if (!confirm('Permanently DELETE this investor and ALL their data? This cannot be undone.')) return;
            if (!confirm('Final confirmation — are you absolutely sure?')) return;
            await db.from('transactions').delete().eq('client_id', clientId);
            await db.from('portfolios').delete().eq('client_id', clientId);
            await db.from('profiles').delete().eq('id', clientId);
            window.location.href = 'admin.html';
        }

        function showMsg(id, msg) {
            const el = document.getElementById(id);
            el.textContent = msg; el.classList.add('show');
            setTimeout(() => el.classList.remove('show'), 4000);
        }

        async function logout() {
            await db.auth.signOut();
            window.location.href = 'index.html';
        }

        init();
    </script>

</body>
