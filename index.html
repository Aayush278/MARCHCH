<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MARCSFUNDHANG — Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg: #0D0F14;
            --card: #151820;
            --card2: #1a1f2e;
            --border: #1E2530;
            --gold: #F0B429;
            --gold-dim: #d4a017;
            --green: #00C896;
            --red: #FF4D4D;
            --white: #FFFFFF;
            --grey: #8B95A1;
            --grey-dim: #4a5568;
        }

        body {
            background: var(--bg);
            color: var(--white);
            font-family: 'Inter', 'Segoe UI', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* ── BACKGROUND EFFECTS ── */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            animation: pulse 6s ease-in-out infinite;
        }

        .bg-glow-1 {
            width: 400px;
            height: 400px;
            background: rgba(240, 180, 41, 0.06);
            top: -100px;
            left: -100px;
            animation-delay: 0s;
        }

        .bg-glow-2 {
            width: 350px;
            height: 350px;
            background: rgba(0, 200, 150, 0.04);
            bottom: -80px;
            right: -80px;
            animation-delay: 3s;
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.015) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.015) 1px, transparent 1px);
            background-size: 40px 40px;
            pointer-events: none;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 0.6;
                transform: scale(1);
            }

            50% {
                opacity: 1;
                transform: scale(1.1);
            }
        }

        /* ── MAIN WRAPPER ── */
        .wrapper {
            width: 100%;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            z-index: 10;
        }

        /* ── LOGIN CARD ── */
        .login-card {
            width: 100%;
            max-width: 420px;
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 2.5rem 2rem;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(30px);
        }

        @keyframes slideUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ── LOGO ── */
        .logo-wrap {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo-icon {
            width: 56px;
            height: 56px;
            background: linear-gradient(135deg, var(--gold), var(--gold-dim));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 1rem;
            font-size: 1.5rem;
            box-shadow: 0 8px 24px rgba(240, 180, 41, 0.3);
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.1s forwards;
            opacity: 0;
        }

        .logo-name {
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 1.5px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
            opacity: 0;
        }

        .logo-tagline {
            font-size: 0.8rem;
            color: var(--grey);
            margin-top: 0.3rem;
            font-weight: 400;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
            opacity: 0;
        }

        /* ── FORM TITLE ── */
        .form-title {
            font-size: 1.2rem;
            font-weight: 600;
            margin-bottom: 0.3rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.25s forwards;
            opacity: 0;
        }

        .form-sub {
            font-size: 0.82rem;
            color: var(--grey);
            margin-bottom: 1.8rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.3s forwards;
            opacity: 0;
        }

        /* ── FORM FIELDS ── */
        .field {
            margin-bottom: 1.1rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.35s forwards;
            opacity: 0;
        }

        .field:nth-child(2) {
            animation-delay: 0.4s;
        }

        .field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 500;
            color: var(--grey);
            margin-bottom: 0.5rem;
            letter-spacing: 0.3px;
        }

        .input-wrap {
            position: relative;
        }

        .input-icon {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--grey-dim);
            font-size: 1rem;
            pointer-events: none;
            transition: color 0.2s;
        }

        .field input {
            width: 100%;
            padding: 0.85rem 1rem 0.85rem 2.8rem;
            background: var(--bg);
            border: 1.5px solid var(--border);
            border-radius: 12px;
            color: var(--white);
            font-size: 0.9rem;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: border-color 0.25s, box-shadow 0.25s, background 0.25s;
            -webkit-appearance: none;
        }

        .field input:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 3px rgba(240, 180, 41, 0.1);
            background: var(--card2);
        }

        .field input:focus+.input-icon,
        .input-wrap:focus-within .input-icon {
            color: var(--gold);
        }

        .field input::placeholder {
            color: var(--grey-dim);
        }

        /* password toggle */
        .pw-toggle {
            position: absolute;
            right: 1rem;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: var(--grey-dim);
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            font-family: 'Inter', sans-serif;
            padding: 0.25rem 0.5rem;
            border-radius: 6px;
            transition: color 0.2s, background 0.2s;
        }

        .pw-toggle:hover {
            color: var(--gold);
            background: rgba(240, 180, 41, 0.08);
        }

        /* ── FORGOT LINK ── */
        .forgot-wrap {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1.2rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.45s forwards;
            opacity: 0;
        }

        .forgot-link {
            font-size: 0.78rem;
            color: var(--grey);
            text-decoration: none;
            transition: color 0.2s;
        }

        .forgot-link:hover {
            color: var(--gold);
        }

        /* ── LOGIN BUTTON ── */
        .btn-login {
            width: 100%;
            padding: 0.9rem;
            background: var(--gold);
            color: #000;
            font-weight: 700;
            font-size: 0.95rem;
            font-family: 'Inter', sans-serif;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, transform 0.15s, box-shadow 0.2s;
            box-shadow: 0 4px 20px rgba(240, 180, 41, 0.3);
            letter-spacing: 0.3px;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
            opacity: 0;
            position: relative;
            overflow: hidden;
        }

        .btn-login::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(rgba(255, 255, 255, 0.1), transparent);
            opacity: 0;
            transition: opacity 0.2s;
        }

        .btn-login:hover {
            background: var(--gold-dim);
            transform: translateY(-1px);
            box-shadow: 0 8px 28px rgba(240, 180, 41, 0.4);
        }

        .btn-login:hover::after {
            opacity: 1;
        }

        .btn-login:active {
            transform: translateY(0);
        }

        .btn-login:disabled {
            background: var(--border);
            color: var(--grey);
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        /* loading spinner inside button */
        .btn-login .spinner {
            display: none;
            width: 18px;
            height: 18px;
            border: 2px solid rgba(0, 0, 0, 0.2);
            border-top-color: #000;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
            margin: 0 auto;
        }

        .btn-login.loading .btn-text {
            display: none;
        }

        .btn-login.loading .spinner {
            display: block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── MESSAGES ── */
        .msg {
            border-radius: 10px;
            padding: 0.75rem 1rem;
            font-size: 0.82rem;
            margin-bottom: 1rem;
            display: none;
            align-items: flex-start;
            gap: 0.6rem;
            animation: msgIn 0.3s ease;
            line-height: 1.5;
        }

        @keyframes msgIn {
            from {
                opacity: 0;
                transform: translateY(-6px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .msg.show {
            display: flex;
        }

        .msg-error {
            background: rgba(255, 77, 77, 0.08);
            border: 1px solid rgba(255, 77, 77, 0.3);
            color: #FF4D4D;
        }

        .msg-success {
            background: rgba(0, 200, 150, 0.08);
            border: 1px solid rgba(0, 200, 150, 0.3);
            color: #00C896;
        }

        .msg-icon {
            font-size: 1rem;
            flex-shrink: 0;
            margin-top: 0.05rem;
        }

        /* ── DIVIDER ── */
        .divider {
            display: flex;
            align-items: center;
            gap: 1rem;
            margin: 1.5rem 0;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.55s forwards;
            opacity: 0;
        }

        .divider-line {
            flex: 1;
            height: 1px;
            background: var(--border);
        }

        .divider-text {
            font-size: 0.75rem;
            color: var(--grey-dim);
        }

        /* ── FORGOT FORM ── */
        .forgot-form {
            display: none;
        }

        .forgot-form.active {
            display: block;
        }

        .login-form.hidden {
            display: none;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.8rem;
            color: var(--grey);
            cursor: pointer;
            background: none;
            border: none;
            font-family: 'Inter', sans-serif;
            padding: 0;
            margin-bottom: 1.2rem;
            transition: color 0.2s;
        }

        .back-btn:hover {
            color: var(--gold);
        }

        /* ── TRUST BADGES ── */
        .trust-row {
            display: flex;
            justify-content: center;
            gap: 1.5rem;
            margin-top: 1.5rem;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) 0.6s forwards;
            opacity: 0;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            font-size: 0.72rem;
            color: var(--grey-dim);
        }

        .trust-item span {
            font-size: 0.85rem;
        }

        /* ── RESPONSIVE ── */
        @media (max-width: 480px) {
            .wrapper {
                padding: 1rem;
                align-items: flex-end;
            }

            .login-card {
                border-radius: 24px 24px 0 0;
                padding: 2rem 1.5rem 2.5rem;
                max-width: 100%;
                box-shadow: 0 -10px 60px rgba(0, 0, 0, 0.5);
            }

            .bg-glow-1 {
                width: 250px;
                height: 250px;
            }

            .bg-glow-2 {
                width: 200px;
                height: 200px;
            }
        }

        @media (min-width: 481px) and (max-width: 768px) {
            .login-card {
                max-width: 380px;
            }
        }
    </style>
</head>

<body>

    <!-- Background effects -->
    <div class="bg-glow bg-glow-1"></div>
    <div class="bg-glow bg-glow-2"></div>
    <div class="bg-grid"></div>

    <div class="wrapper">
        <div class="login-card">

            <!-- Logo -->
            <div class="logo-wrap">
                <div class="logo-icon">💼</div>
                <div class="logo-name">MARCSFUNDHANG</div>
                <div class="logo-tagline">Manage your investments, simply.</div>
            </div>

            <!-- Error / Success messages -->
            <div class="msg msg-error" id="errorMsg">
                <span class="msg-icon">⚠️</span>
                <span id="errorText"></span>
            </div>
            <div class="msg msg-success" id="successMsg">
                <span class="msg-icon">✅</span>
                <span id="successText"></span>
            </div>

            <!-- LOGIN FORM -->
            <div class="login-form" id="loginForm">
                <div class="form-title">Welcome back 👋</div>
                <div class="form-sub">Sign in to your investor account</div>

                <div class="field">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="email" placeholder="you@example.com" autocomplete="email"
                            onkeydown="if(event.key==='Enter') document.getElementById('password').focus()" />
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <div class="field">
                    <label>Password</label>
                    <div class="input-wrap">
                        <input type="password" id="password" placeholder="Enter your password"
                            autocomplete="current-password" onkeydown="if(event.key==='Enter') login()" />
                        <span class="input-icon">🔒</span>
                        <button class="pw-toggle" type="button" onclick="togglePw('password', this)">Show</button>
                    </div>
                </div>

                <div class="forgot-wrap">
                    <a class="forgot-link" href="#" onclick="showForgot(); return false;">Forgot password?</a>
                </div>

                <button class="btn-login" id="loginBtn" onclick="login()">
                    <span class="btn-text">Sign In</span>
                    <div class="spinner"></div>
                </button>

                <div class="trust-row">
                    <div class="trust-item"><span>🔒</span> Secure login</div>
                    <div class="trust-item"><span>🛡️</span> Data encrypted</div>
                    <div class="trust-item"><span>✅</span> 100% private</div>
                </div>
            </div>

            <!-- FORGOT PASSWORD FORM -->
            <div class="forgot-form" id="forgotForm">
                <button class="back-btn" onclick="showLogin()">← Back to login</button>
                <div class="form-title">Reset password 🔑</div>
                <div class="form-sub">Enter your email and we'll send you a reset link</div>

                <div class="field">
                    <label>Email Address</label>
                    <div class="input-wrap">
                        <input type="email" id="resetEmail" placeholder="you@example.com" autocomplete="email"
                            onkeydown="if(event.key==='Enter') resetPassword()" />
                        <span class="input-icon">📧</span>
                    </div>
                </div>

                <button class="btn-login" id="resetBtn" onclick="resetPassword()">
                    <span class="btn-text">Send Reset Link</span>
                    <div class="spinner"></div>
                </button>
            </div>

        </div>
    </div>

    <script>
        // ── TOGGLE PASSWORD VISIBILITY ──
        function togglePw(inputId, btn) {
            const input = document.getElementById(inputId);
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = 'Hide';
            } else {
                input.type = 'password';
                btn.textContent = 'Show';
            }
        }

        // ── SHOW / HIDE FORMS ──
        function showForgot() {
            document.getElementById('loginForm').classList.add('hidden');
            document.getElementById('forgotForm').classList.add('active');
            hideMessages();
        }

        function showLogin() {
            document.getElementById('forgotForm').classList.remove('active');
            document.getElementById('loginForm').classList.remove('hidden');
            hideMessages();
        }

        // ── MESSAGES ──
        function showError(msg) {
            hideMessages();
            document.getElementById('errorText').textContent = msg;
            document.getElementById('errorMsg').classList.add('show');
        }

        function showSuccess(msg) {
            hideMessages();
            document.getElementById('successText').textContent = msg;
            document.getElementById('successMsg').classList.add('show');
        }

        function hideMessages() {
            document.getElementById('errorMsg').classList.remove('show');
            document.getElementById('successMsg').classList.remove('show');
        }

        // ── SET LOADING STATE ──
        function setLoading(btnId, loading) {
            const btn = document.getElementById(btnId);
            if (loading) {
                btn.classList.add('loading');
                btn.disabled = true;
            } else {
                btn.classList.remove('loading');
                btn.disabled = false;
            }
        }

        // ── LOGIN ──
        async function login() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;

            if (!email || !password) {
                showError('Please enter your email and password.');
                return;
            }

            setLoading('loginBtn', true);
            hideMessages();

            try {
                const { data, error } = await db.auth.signInWithPassword({ email, password });

                if (error) {
                    showError('Invalid email or password. Please try again.');
                    setLoading('loginBtn', false);
                    return;
                }

                // Get profile
                const { data: profile, error: profileError } = await db
                    .from('profiles')
                    .select('role, is_active, full_name')
                    .eq('id', data.user.id)
                    .single();

                if (profileError || !profile) {
                    showError('Account not found. Please contact MARCSFUNDHANG.');
                    await db.auth.signOut();
                    setLoading('loginBtn', false);
                    return;
                }

                if (!profile.is_active) {
                    showError('Your account has been suspended. Please contact MARCSFUNDHANG.');
                    await db.auth.signOut();
                    setLoading('loginBtn', false);
                    return;
                }

                // Redirect
                if (profile.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else {
                    window.location.href = 'dashboard.html';
                }

            } catch (err) {
                showError('Something went wrong. Please try again.');
                setLoading('loginBtn', false);
            }
        }

        // ── RESET PASSWORD ──
        async function resetPassword() {
            const email = document.getElementById('resetEmail').value.trim();

            if (!email) {
                showError('Please enter your email address.');
                return;
            }

            setLoading('resetBtn', true);
            hideMessages();

            try {
                const { error } = await db.auth.resetPasswordForEmail(email, {
                    redirectTo: window.location.origin + '/set-password.html'
                });

                if (error) {
                    showError('Something went wrong. Please try again.');
                } else {
                    showSuccess('Reset link sent! Please check your email inbox.');
                    document.getElementById('resetEmail').value = '';
                }
            } catch (err) {
                showError('Something went wrong. Please try again.');
            }

            setLoading('resetBtn', false);
        }

        // ── CHECK IF ALREADY LOGGED IN ──
        async function checkExistingSession() {
            const { data: { session } } = await db.auth.getSession();
            if (session) {
                const { data: profile } = await db
                    .from('profiles')
                    .select('role')
                    .eq('id', session.user.id)
                    .single();
                if (profile?.role === 'admin') {
                    window.location.href = 'admin-dashboard.html';
                } else if (profile?.role === 'client') {
                    window.location.href = 'dashboard.html';
                }
            }
        }

        checkExistingSession();
    </script>

</body>

</html>
